# Buduje stronę i wysyła ją na serwer home.pl po każdej zmianie w gałęzi main.
# Wymagane sekrety repozytorium (Settings → Secrets and variables → Actions):
#   FTP_SERVER   – dokładna nazwa serwera FTP z panelu home.pl (nie nazwa domeny strony)
#   FTP_USERNAME – login FTP
#   FTP_PASSWORD – hasło FTP
#   FTP_DIR      – katalog docelowy na serwerze, zakończony ukośnikiem, np. /public_html/test/
name: Publikacja strony
on:
  push:
    branches: [main]
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: publikacja
  cancel-in-progress: true
jobs:
  publikacja:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npm run build
      # Dopóki sekrety FTP nie są ustawione, strona tylko się buduje (bez wysyłki).
      - name: Wysyłka przez FTPS
        if: env.FTP_SERVER != ''
        env:
          FTP_SERVER: ${{ secrets.FTP_SERVER }}
        # Akcja przypięta do niezmiennego wydania v4.3.5
        uses: SamKirkland/FTP-Deploy-Action@8e83cea8672e3fbcbb9fdafff34debf6ae4c5f65
        with:
          server: ${{ secrets.FTP_SERVER }}
          username: ${{ secrets.FTP_USERNAME }}
          password: ${{ secrets.FTP_PASSWORD }}
          # Wymuszone szyfrowanie (FTPS) ze ścisłym sprawdzaniem certyfikatu serwera.
          # FTP_SERVER musi być dokładną nazwą serwera z panelu home.pl.
          protocol: ftps
          security: strict
          local-dir: ./_site/
          server-dir: ${{ secrets.FTP_DIR }}
